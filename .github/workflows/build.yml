name: Build executables

# Construye binarios autocontenidos para Windows, macOS y Linux en runners nativos
# (PyInstaller no cross-compila). Se ejecuta en cada push/PR y, al publicar un tag
# vX.Y.Z, adjunta los binarios a una GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: SmartIntersection-linux
            bin: dist/SmartIntersection
          - os: windows-latest
            asset: SmartIntersection-windows.exe
            bin: dist/SmartIntersection.exe
          - os: macos-latest
            asset: SmartIntersection-macos
            bin: dist/SmartIntersection

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build (PyInstaller)
        run: python -m PyInstaller --clean -y trafic_meth.spec

      - name: Rename binary
        shell: bash
        run: cp "${{ matrix.bin }}" "${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    # Solo al publicar un tag vX.Y.Z: junta los 3 binarios en una Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
